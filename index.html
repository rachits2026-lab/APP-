<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd23f">
  <meta name="description" content="Find the chirping smoke detector, keep a list of every detector you own, and get reminded when batteries or replacements are due.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Chirp Hunter</title>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="#/"><img src="/logo.png" alt="Chirp Hunter"></a>
    <div class="streak" id="streak" role="status">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-4-1-6 2-10.5z"/></svg>
      <span id="streak-n">0</span>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav class="tabs" aria-label="Main">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="#/find" data-tab="find">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><path d="M7 7a7 7 0 0 0 0 10M17 7a7 7 0 0 1 0 10M4 4a11 11 0 0 0 0 16M20 4a11 11 0 0 1 0 16"/></svg>
      <span>Find</span>
    </a>
    <a href="#/detectors" data-tab="detectors">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Detectors</span>
    </a>
    <a href="#/test" data-tab="test">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg>
      <span>Test</span>
    </a>
    <a href="#/reminders" data-tab="reminders">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>Reminders</span>
    </a>
  </nav>
  <noscript><p style="padding:24px;font:18px sans-serif">Chirp Hunter needs JavaScript turned on.</p></noscript>
  <script type="module" src="/src/main.js"></script>
  <script>
    // If the app has not drawn anything after a few seconds, it was most likely
    // opened as a plain file or from a server that cannot run it. Say so.
    setTimeout(function () {
      var m = document.getElementById('main');
      if (m && !m.childElementCount) {
        m.innerHTML = '<h1 style="font:700 28px sans-serif">The app did not start</h1>' +
          '<p style="font:18px sans-serif">Do not open index.html directly. In the project folder run <b>npm run dev</b> and open the address it prints, or run <b>npm start</b> and open <b>http://localhost:4173</b>.</p>';
      }
    }, 3000);
  </script>
</body>
</html>
